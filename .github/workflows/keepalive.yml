name: keepalive
# Hält den Render-Dienst wach: 25.11.2026 07:00 bis 24.12.2026 12:00 (Bern), werktags 07:00–19:00.
# GitHub rechnet in UTC (Nov/Dez Bern = UTC+1). Tag und Wochentag werden im Skript geprüft,
# weil Cron Tag-im-Monat UND Wochentag nicht kombinieren kann (sonst gilt "oder").
on:
  schedule:
    - cron: '*/5 6-17 * 11,12 1-5'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Zeitfenster prüfen und pingen
        env:
          APP_URL: ${{ vars.APP_URL || 'https://grand-prix-ambition.onrender.com' }}
        run: |
          NOW=$(TZ=Europe/Zurich date +%Y%m%d%H%M)
          if [ "$NOW" -lt 202611250700 ] || [ "$NOW" -ge 202612241200 ]; then echo "Ausserhalb des Zeitfensters ($NOW) – kein Ping."; exit 0; fi
          HM=$(TZ=Europe/Zurich date +%H%M)
          if [ "$HM" -lt 0700 ] || [ "$HM" -ge 1900 ]; then echo "Ausserhalb 07–19 Uhr – kein Ping."; exit 0; fi
          if [ -z "$APP_URL" ]; then echo "Bitte unter Settings → Variables die Variable APP_URL setzen."; exit 1; fi
          curl -fsS --max-time 90 --retry 2 "$APP_URL/api/health"
